name: Execution scaffold (offline)

on:
  pull_request:
    paths:
      - 'grokcell/**'
      - 'osahr/**'
      - 'pyproject.toml'
      - '.github/workflows/execution-scaffold.yml'
  push:
    branches: [main]
    paths:
      - 'grokcell/**'
      - 'osahr/**'
      - 'pyproject.toml'
      - '.github/workflows/execution-scaffold.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-25
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-09-25
        with:
          python-version: ${{ matrix.python }}
      - name: Install existing packages
        run: |
          python -m pip install "setuptools>=75" wheel
          python -m pip install --no-build-isolation -e . -e ./grokcell
      - name: Root and workbench regressions
        run: python -m pytest tests workbench/tests -q
      - name: Scaffold and repair offline regressions
        working-directory: grokcell
        run: python -m pytest tests/test_execution_scaffold.py tests/test_repair_offline.py -q
      - name: Wheel smoke outside the checkout
        run: |
          python -m pip wheel ./grokcell --no-deps --no-build-isolation -w "$RUNNER_TEMP/wheels"
          python -m pip install --no-deps --target "$RUNNER_TEMP/wheel-package" "$RUNNER_TEMP"/wheels/*.whl
          cd "$RUNNER_TEMP"
          export PYTHONPATH="$RUNNER_TEMP/wheel-package"
          python -c 'import os, grokcell; assert grokcell.__file__.startswith(os.environ["PYTHONPATH"])'
          python -m grokcell.execution repair --replay
          python -m grokcell.execution dependency --replay
