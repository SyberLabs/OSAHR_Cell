[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grokcell-surface"
version = "0.1.0"
description = "Stateful GrokCell agentic surface over the frozen OSAHR kernel"
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools.packages.find]
include = ["grokcell*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "-q"
