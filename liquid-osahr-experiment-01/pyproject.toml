[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquid-osahr-experiment-01"
version = "0.1.0"
description = "Liquid neural marked point-process hazards coupled to the OSAHR stochastic graph-rewrite runtime"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "torch>=2.5",
  "scipy>=1.12",
  "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = [".", "vendor"]
include = ["liquid_osahr*", "osahr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
