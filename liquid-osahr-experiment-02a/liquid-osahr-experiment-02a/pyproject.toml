[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquid-osahr-experiment-02a"
version = "0.1.0"
description = "Closed-loop topology-coupled liquid neural state with certified stochastic OSAHR graph rewriting"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "OSAHR Research Prototype"}]
dependencies = [
  "numpy>=2.0",
  "torch>=2.5",
  "scipy>=1.12",
  "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = [".", "vendor"]
include = ["liquid_osahr02a*", "osahr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "vendor"]
