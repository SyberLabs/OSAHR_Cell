name: Cloudflare preflight image

on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-preflight.yml"
      - "deploy/cloudflare/**"
      - "grokcell/grokcell/repair_status_http.py"
      - "grokcell/grokcell/repair_experiment.py"
      - "grokcell/grokcell/repair_fixture.py"
      - "grokcell/tests/repair_contracts/**"
      - "grokcell/pyproject.toml"
      - "osahr/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-preflight.yml"
      - "deploy/cloudflare/**"
      - "grokcell/grokcell/repair_status_http.py"
      - "grokcell/grokcell/repair_experiment.py"
      - "grokcell/grokcell/repair_fixture.py"
      - "grokcell/tests/repair_contracts/**"
      - "grokcell/pyproject.toml"
      - "osahr/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Python image
        run: docker build -f deploy/cloudflare/Dockerfile -t osahr-grokcell-preflight .
      - name: Check read-only routes
        run: |
          docker run -d --name osahr-preflight -p 127.0.0.1:18080:8080 osahr-grokcell-preflight
          trap 'docker logs osahr-preflight; docker rm -f osahr-preflight' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 2
          done
          python - <<'PY'
          import json
          from urllib.error import HTTPError
          from urllib.request import urlopen

          base = "http://127.0.0.1:18080"
          with urlopen(base + "/preflight") as response:
              payload = json.load(response)
          assert payload["contract_count"] == 9
          assert payload["paired_pilot_ready"] is False
          assert payload["live_execution_enabled"] is False
          try:
              urlopen(base + "/live")
          except HTTPError as exc:
              assert exc.code == 404
          else:
              raise AssertionError("live route unexpectedly reachable")
          PY
