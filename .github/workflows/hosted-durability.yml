name: Hosted durability

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: osahr_test
          POSTGRES_USER: osahr_test
          POSTGRES_PASSWORD: osahr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U osahr_test -d osahr_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install hosted test dependencies
        run: python -m pip install -e . -e './grokcell[hosted]'
      - name: Verify PostgreSQL durability contract
        env:
          OSAHR_TEST_DATABASE_URL: postgresql://osahr_test:osahr_test@localhost:5432/osahr_test
        run: python -m pytest grokcell/tests/test_hosted_durability.py -q
