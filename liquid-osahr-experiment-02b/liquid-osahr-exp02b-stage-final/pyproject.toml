[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liquid-osahr-experiment-02b"
version = "0.2.0"
description = "Intervention-calibrated standards-informed RAN residual liquid neural twin over OSAHR"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "OSAHR Research Prototype"}]
dependencies = [
  "numpy>=2.0",
  "torch>=2.5",
  "scipy>=1.12",
  "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["liquid_osahr02b*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
