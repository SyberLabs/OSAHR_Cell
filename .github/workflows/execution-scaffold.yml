name: Execution contract and demo

on:
  pull_request:
    paths: ['grokcell/**', 'osahr/**', 'pyproject.toml', '.github/workflows/execution-scaffold.yml']
  push:
    branches: [main]
    paths: ['grokcell/**', 'osahr/**', 'pyproject.toml', '.github/workflows/execution-scaffold.yml']

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install existing packages and declared regression dependencies
        run: |
          python -m pip install "setuptools>=75" wheel
          python -m pip install --no-build-isolation -e . -e ./grokcell
          python -m pip install --no-build-isolation -e ./liquid-osahr-experiment-05 -e ./liquid-osahr-experiment-06
      - name: Root and workbench regressions
        run: python -m pytest tests workbench/tests -q
      - name: Execution, recovery, provider-conformance and repair regressions
        working-directory: grokcell
        run: python -m pytest tests/test_execution_*.py tests/test_repair_offline.py -ra
      - name: Wheel, fresh-process demo and local rollback outside checkout
        run: |
          python -m pip wheel ./grokcell --no-deps --no-build-isolation -w "$RUNNER_TEMP/wheels"
          python -m pip install --no-deps --target "$RUNNER_TEMP/wheel-package" "$RUNNER_TEMP"/wheels/*.whl
          cd "$RUNNER_TEMP"
          export PYTHONPATH="$RUNNER_TEMP/wheel-package"
          python -c 'import os, grokcell; assert grokcell.__file__.startswith(os.environ["PYTHONPATH"])'
          python -m grokcell.execution repair --replay
          python -m grokcell.execution dependency --replay
          python -m grokcell.execution demo --out "$RUNNER_TEMP/demo-evidence"
          python -m grokcell.execution release-check --out "$RUNNER_TEMP/rollback-evidence"
          python -m grokcell.execution preflight

  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install packages
        run: |
          python -m pip install "setuptools>=75" wheel
          python -m pip install --no-build-isolation -e . -e ./grokcell
      - name: Resolve a test image digest before candidate execution
        run: |
          docker pull python:3.11-slim
          image=$(docker image inspect python:3.11-slim --format '{{index .RepoDigests 0}}')
          test -n "$image"
          echo "GROKCELL_SANDBOX_IMAGE=$image" >> "$GITHUB_ENV"
          echo "Test executor pinned for this run: $image"
      - name: Actual isolation, behavioral checks and early-exit refusals
        working-directory: grokcell
        run: python -m pytest tests/test_execution_demo.py -ra
      - name: Isolated demo with restart replay
        run: python -m grokcell.execution demo --mode isolated --out "$RUNNER_TEMP/isolated-demo"
